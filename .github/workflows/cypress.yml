name: Cypress Tests
on: [push]
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm install # Using 'install' here is more flexible than 'ci' for now

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          # Adding --host ensures the GitHub runner can connect to port 8080
          start: npm run dev -- --host
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 120
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}